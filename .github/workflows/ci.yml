name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0

      - name: Use devenv binary cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv

      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      - name: Cache Mix and pnpm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
            .devenv/state/mix
            .devenv/test-state/mix
            ~/.hex
            assets/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('devenv.lock', 'mix.lock', 'assets/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-deps-${{ hashFiles('devenv.lock') }}-
            ${{ runner.os }}-deps-

      - name: Run tests
        run: devenv test
